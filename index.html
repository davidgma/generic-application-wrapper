<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Gawkyy - A modern, web-native offline-first MS Access in the browser. Portable SQLite apps with dynamic TSX plugins, interactive query grids, spreadsheets, and reports." />
    <meta property="og:title" content="Gawkyy" />
    <meta property="og:description" content="Gawkyy - A modern, web-native offline-first MS Access in the browser. Portable SQLite apps with dynamic TSX plugins, interactive query grids, spreadsheets, and reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gawkyy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/gawkyy-cat-64x64.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          if (window.opener && window.location.search && window.location.search.includes('code=')) {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (code) {
              window.opener.postMessage({ type: 'DROPBOX_OAUTH_CODE', code: code }, '*');
              window.close();
            }
          }
        } catch (e) {
          // Ignore cross-origin opener errors in iframe
        }
        // Unregister any stale dev-sw on localhost or preview
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                var reg = registrations[i];
                if (reg.active && reg.active.scriptURL && (reg.active.scriptURL.indexOf('dev-sw.js') !== -1 || reg.active.scriptURL.indexOf('@vite') !== -1)) {
                  reg.unregister();
                }
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
